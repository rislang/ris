# ris's gates on macOS arm64 (SPEC 7.1): Homebrew's Crystal and LLVM, smoke
# samples, then check.sh in parts without the checks RIS_CHECK_SKIP names.
name: ris macos

on:
  push:
    branches: [main, macos-arm64]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        shard: ["smoke", "1/3", "2/3", "3/3", heap]
    runs-on: macos-15
    timeout-minutes: 90
    name: "macos arm64, ${{ matrix.shard }}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Crystal, coreutils and LLVM 23
        run: |
          brew install bash crystal coreutils llvm pkgconf
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "LLVM_CONFIG=$(brew --prefix llvm)/bin/llvm-config" >> "$GITHUB_ENV"
      - name: Build ris
        run: |
          set +e
          $LLVM_CONFIG --version
          crystal --version
          make ris > build.log 2>&1
          rc=$?
          echo "make rc=$rc"
          tail -60 build.log | cut -c1-400
          ls -la .build || true
          exit $rc
      - name: Hello, a program with tasks, release mode
        if: matrix.shard == 'smoke'
        run: |
          ./bin/ris version
          ./bin/ris run samples/ris/hello.ri
          ./bin/ris run samples/ris/respond.ri
          ./bin/ris run samples/ris/report.ri
          ./bin/ris run samples/ris/owned_cache.ri
          ./bin/ris build --release samples/ris/respond.ri -o /tmp/r && RIS_TAPE_STATS=1 /tmp/r | tail -3
      - name: test/ris/check.sh
        if: matrix.shard != 'smoke'
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          ulimit -n 10240
          ulimit -s 65520
          rc=0
          bash test/ris/check.sh > check.log 2>&1 || rc=$?
          grep -E '^(FAILED|FAIL|PASS)' check.log | cut -c1-400 || true
          echo "check.sh rc=$rc"
          exit $rc
        env:
          RIS_CHECK_SHARD: ${{ matrix.shard }}
          RIS_CHECK_TIMEOUT: "300"
          # These read /proc: Linux's, not the behavior (TODO.md, macOS arm64).
          RIS_CHECK_SKIP: 'scope_frees\.ri|file_copy_to\.ri|fibers/spares\.ri|tls_session_tickets\.ri'
      - uses: actions/upload-artifact@v5
        if: always() && matrix.shard != 'smoke'
        with:
          name: check-log-${{ strategy.job-index }}
          path: check.log
          if-no-files-found: ignore

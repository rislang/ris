# ris on macOS arm64: a trial on its branch, not a target yet (SPEC 7.1).
name: ris macos

on:
  push:
    branches: [macos-arm64]
  workflow_dispatch:

permissions: {}

env:
  LLVM_CONFIG: /tmp/llvm/bin/llvm-config

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        shard: ["smoke", "1/3", "2/3", "3/3", heap]
    runs-on: macos-15
    timeout-minutes: 90
    name: "macos arm64, ${{ matrix.shard }}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Crystal, coreutils and LLVM 23
        run: |
          brew install crystal coreutils pkgconf
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          mkdir -p /tmp/llvm
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-macOS-ARM64.tar.xz |
            tar -xJ --strip-components=1 -C /tmp/llvm
          /tmp/llvm/bin/llvm-config --version
      - name: Build ris
        run: make ris
      - name: Hello, a program with tasks, release mode
        if: matrix.shard == 'smoke'
        run: |
          ./bin/ris version
          ./bin/ris run samples/ris/hello.ri
          ./bin/ris run samples/ris/respond.ri
          ./bin/ris run samples/ris/report.ri
          ./bin/ris run samples/ris/owned_cache.ri
          ./bin/ris build --release samples/ris/respond.ri -o /tmp/r && RIS_TAPE_STATS=1 /tmp/r | tail -3
      - name: test/ris/check.sh
        if: matrix.shard != 'smoke'
        run: |
          ulimit -n 10240
          ulimit -s 65520
          bash test/ris/check.sh 2>&1 | tee check.log | grep -E '^(FAILED|FAIL|PASS)|checks' || true
          grep -c '^FAILED' check.log || true
          ! grep -q '^FAIL' check.log
        env:
          RIS_CHECK_SHARD: ${{ matrix.shard }}
          RIS_CHECK_TIMEOUT: "300"
      - uses: actions/upload-artifact@v5
        if: always() && matrix.shard != 'smoke'
        with:
          name: check-log-${{ strategy.job-index }}
          path: check.log
          if-no-files-found: ignore

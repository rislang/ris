name: ris

# ris's gates: the compiler built from a clean checkout, test/ris/check.sh on
# the two targets ris programs have (SPEC 7.1), and the library's specs.
#
# Never upload or restore .build/crystal here. bin/crystal prefers it to the
# Crystal on PATH, and a compiler built from this source has String as a
# struct, so it cannot build the compiler again. `make ris` goes straight from
# the image's Crystal to .build/iyi.
on:
  push:
    branches: [main]
    tags: ["editor-v*"]
  pull_request:
  workflow_dispatch:

# git refuses a workspace another user owns; a container job's is one.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  LLVM_CONFIG: llvm-config-23

permissions: {}

# A new push replaces a pull request's run, but every commit on main is judged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # check.sh in four parts per target, each its own runner: the blocks in
  # three shards and the heap gate alone (check_parallel.py). On one 4-CPU
  # runner the whole suite took 14 minutes.
  check:
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
        shard: ["1/3", "2/3", "3/3", heap]
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    container:
      image: crystallang/crystal:1.21.0-build
      # check.sh serves many sockets. The stack is for the compiler: its tape
      # checkers recurse past 8 MB on test/ris/std_small_tape.ri.
      options: >-
        --ulimit nofile=65536:65536
        --ulimit stack=67108864:67108864
    name: "check.sh ${{ matrix.shard }}, ${{ matrix.target.arch }}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LLVM 23 and the checks' tools
        run: bash .github/ci-setup.sh
      - name: Build ris
        run: make ris
      - name: The respond sample runs
        if: matrix.shard == 'heap'
        run: ./bin/ris run samples/ris/respond.ri
      - name: test/ris/check.sh
        run: bash test/ris/check.sh
        env:
          RIS_CHECK_SHARD: ${{ matrix.shard }}
          RIS_CHECK_TIMEOUT: "600"

  # The compiler is still a Crystal program built with this library.
  std-spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: crystallang/crystal:1.21.0-build
    name: "The library's specs"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LLVM 23 and the checks' tools
        run: bash .github/ci-setup.sh
      - name: make std_spec
        run: make std_spec

  vscode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: "The VS Code client packages, and a tag publishes it"
    # A step's `if` cannot read the `secrets` context, and the job's `env`
    # can: that is what lets a registry whose token is not set yet be
    # skipped instead of failing the tag that publishes to the other one.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Package the extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx --yes @vscode/vsce package

      # A tag that disagrees with the manifest publishes the wrong version
      # under the right name, and the Marketplace keeps what it is given.
      - name: The tag names the version the manifest carries
        if: startsWith(github.ref, 'refs/tags/editor-v')
        working-directory: editors/vscode
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#editor-v}"
          [ "$manifest" = "$tag" ] || {
            echo "package.json says $manifest, the tag says $tag"
            exit 1
          }

      # `--packagePath` publishes the file the step above built and CI
      # already looked at, rather than packaging a second time.
      - name: Publish to the Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/editor-v') && env.VSCE_PAT != ''
        working-directory: editors/vscode
        run: |
          npx --yes @vscode/vsce publish \
            --packagePath "iyi-${GITHUB_REF_NAME#editor-v}.vsix"

      # The same file, to the registry every VS Code fork reads. `ovsx`
      # takes the token from OVSX_PAT, and the namespace must exist first:
      # `npx ovsx create-namespace iyilang`, once.
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/editor-v') && env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: npx --yes ovsx publish "iyi-${GITHUB_REF_NAME#editor-v}.vsix"

      - uses: actions/upload-artifact@v5
        with:
          name: iyi-vscode
          path: editors/vscode/*.vsix
          retention-days: 7

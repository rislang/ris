# ris: the release tarballs, built with a static LLVM so they need no
# Crystal and no LLVM where they land. ris.yml holds the gates.
#
# Every run builds and proves the tarballs for linux x86_64 and aarch64 and
# macos arm64 (SPEC 7.1); a `ris-v*` tag also publishes them, with
# SHA256SUMS, as the release `install_ris.sh` installs from.
name: ris release

on:
  push:
    tags: ["ris-v*"]
  workflow_dispatch:

# git refuses a workspace another user owns; a container job's is one.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

permissions: {}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 240
    container:
      image: crystallang/crystal:1.21.0-build
    name: "The ris tarball, linux ${{ matrix.target.arch }}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # install_ris.sh asks for ris-<tag's version>-<target>.tar.gz.
      - name: A tag names the version the compiler carries
        if: startsWith(github.ref, 'refs/tags/ris-v')
        run: |
          version=$(sed -n 's/^ *RIS_VERSION = "\(.*\)"/\1/p' src/compiler/iyi/config.cr)
          if [ "${GITHUB_REF_NAME#ris-v}" != "$version" ]; then
            echo "the tag is $GITHUB_REF_NAME, the compiler's RIS_VERSION is $version" >&2
            exit 1
          fi

      - name: Restore the static LLVM
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/llvm-static
          key: llvm-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-static-llvm.sh') }}
      - name: Build the static LLVM (cache miss)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          apt-get update -qq && apt-get install -y -qq cmake curl xz-utils > /dev/null
          bash scripts/build-static-llvm.sh /tmp/llvm-static
      # Saved here, not at the job's end: a later failure keeps this hour.
      - name: Save the static LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/llvm-static
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Build ris and package it
        run: make ris-tarball LLVM_CONFIG=/tmp/llvm-static/bin/llvm-config

      # Every std module and shipped sample builds out of the package.
      - name: The package carries a usable standard library
        run: bash test/cli/tarball_std.sh .build/ris-package

      - name: Stage the tarball
        run: mkdir -p dist && cp .build/ris-*-linux-*.tar.gz dist/

      - uses: actions/upload-artifact@v5
        with:
          name: ris-linux-${{ matrix.target.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-15
    timeout-minutes: 240
    name: "The ris tarball, macos arm64"
    # Bundled Homebrew dylibs carry their bottles' minimum macOS; ris and
    # LLVM ask for no older one.
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: A tag names the version the compiler carries
        if: startsWith(github.ref, 'refs/tags/ris-v')
        run: |
          version=$(sed -n 's/^ *RIS_VERSION = "\(.*\)"/\1/p' src/compiler/iyi/config.cr)
          if [ "${GITHUB_REF_NAME#ris-v}" != "$version" ]; then
            echo "the tag is $GITHUB_REF_NAME, the compiler's RIS_VERSION is $version" >&2
            exit 1
          fi

      # Crystal builds the compiler; LLVM is our static one, not brew's.
      - name: Crystal, bash and coreutils
        run: |
          brew install bash crystal coreutils cmake pkgconf
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Restore the static LLVM
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/llvm-static
          key: llvm-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-static-llvm.sh') }}
      - name: Build the static LLVM (cache miss)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-static-llvm.sh /tmp/llvm-static
      - name: Save the static LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/llvm-static
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Build ris and package it
        run: make ris-tarball LLVM_CONFIG=/tmp/llvm-static/bin/llvm-config

      - name: The package carries a usable standard library
        run: bash test/cli/tarball_std.sh .build/ris-package

      - name: Stage the tarball
        run: mkdir -p dist && cp .build/ris-*-macos-*.tar.gz dist/

      - uses: actions/upload-artifact@v5
        with:
          name: ris-macos-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  clean-room-macos:
    needs: macos
    runs-on: macos-15
    timeout-minutes: 20
    name: "install_ris.sh, on macos arm64 without Homebrew"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: ris-macos-arm64
          path: dist/

      - name: The tarball names nothing it does not carry
        run: |
          mkdir -p room && tar -xzf dist/*.tar.gz -C room
          bash scripts/bundle-runtime-libs.sh room --verify-only

      # The runner image has Homebrew; PATH leaves it out and the brew
      # prefixes are moved aside, so a dylib ris wrongly names fails here.
      - name: Install it with only the system's tools, then hello world
        run: |
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
          for d in /opt/homebrew /usr/local/Cellar /usr/local/opt; do
            if [ -e "$d" ]; then sudo mv "$d" "$d.off"; fi
          done
          env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            RIS_RELEASE_URL="file://$PWD/dist" /bin/sh -c '
            set -e
            mkdir -p "$HOME"
            sh ./install_ris.sh
            export PATH="$HOME/.local/bin:$PATH"
            ris version
            ris init hello "$HOME/hello"
            cd "$HOME/hello"
            ris run hello.ri
            ris run "$HOME/.local/lib/ris/share/ris/samples/hello.ri"
          '

  clean-room:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    name: "install_ris.sh, on ${{ matrix.target.arch }} with only gcc"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: ris-linux-${{ matrix.target.arch }}
          path: dist/

      - name: The tarball names nothing it does not carry
        run: |
          mkdir -p room && tar -xzf dist/*.tar.gz -C room
          bash scripts/bundle-runtime-libs.sh room --verify-only

      - name: Install it in a bare image, then hello world
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          docker run --rm -v "$PWD:/src" ubuntu:26.04 sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq gcc libc6-dev curl ca-certificates > /dev/null
            RIS_RELEASE_URL=file:///src/dist sh /src/install_ris.sh
            export PATH="$HOME/.local/bin:$PATH"
            ris version
            ris init hello "$HOME/hello"
            cd "$HOME/hello"
            ris run hello.ri
            ris run "$HOME/.local/lib/ris/share/ris/samples/hello.ri"
          '

      # glibc 2.41: Debian 13, which Raspberry Pi OS Trixie is. The build image
      # has glibc 2.39, so Bookworm (2.36) builds from source for now.
      - name: The same on debian:13 (Raspberry Pi OS)
        run: |
          docker run --rm -v "$PWD:/src" debian:13 sh -c '
            set -e
            ldd --version | head -n 1
            apt-get update -qq
            apt-get install -y -qq gcc libc6-dev curl ca-certificates > /dev/null
            RIS_RELEASE_URL=file:///src/dist sh /src/install_ris.sh
            export PATH="$HOME/.local/bin:$PATH"
            ris version
            ris init hello "$HOME/hello"
            cd "$HOME/hello"
            ris run hello.ri
          '

  release:
    if: startsWith(github.ref, 'refs/tags/ris-v')
    needs: [clean-room, clean-room-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: ris-*
          merge-multiple: true
          path: dist/
      - name: Create the release from the proven tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          gh release create "$tag" --title "ris ${tag#ris-v}" --latest \
            --notes "ris ${tag#ris-v}: install with install_ris.sh (README.md)." \
            dist/*.tar.gz dist/SHA256SUMS
